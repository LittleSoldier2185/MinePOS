org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Project lives on a different drive letter (G:) than the Gradle/pub caches
# (C:). Kotlin's incremental-compilation cache tries to store plugin source
# paths relative to the build dir, which is impossible across drive letters
# on Windows and crashes with "this and base files have different roots".
# Disabling incremental compilation avoids ever writing that cache.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
