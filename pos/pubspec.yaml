name: pos
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Thai/English UI translations (see l10n.yaml, lib/l10n/).
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Custom title bar / window controls for the Windows desktop host.
  window_manager: ^0.4.3
  # Matches the mockups' Quicksand/Montserrat typography.
  google_fonts: ^6.2.1
  # Shop logo selection during onboarding (Windows/Android/Web supported).
  image_picker: ^1.1.2
  # mDNS discovery/broadcast for finding a MinePOS host on the local network.
  bonsoir: ^5.1.9
  # HTTP client for real API calls to the MinePOS backend.
  http: ^1.2.2
  # Renders the PromptPay QR payload (see features/cashier/services/promptpay_qr.dart).
  qr_flutter: ^4.1.0
  file_picker: ^11.0.2
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3
  intl: ^0.20.2
  unified_esc_pos_printer: ^3.3.3
  # Shared backend (routes/db/auth) reused in-process for mobile self-host —
  # see core/services/mobile_server_launcher.dart.
  minepos_server:
    path: ../server
  # Pinned to the last version that actually bundles native sqlite3 binaries
  # for Android/iOS — 0.6.0+ is a no-op stub that only works with sqlite3
  # 3.x (which needs Dart build hooks + has breaking API changes we don't
  # want to force onto the already-verified Windows server path). Revisit
  # once the server package is deliberately upgraded to sqlite3 3.x.
  sqlite3_flutter_libs: ^0.5.42
  # Dart API for sqlite3 (native binaries come from sqlite3_flutter_libs
  # above) — same constraint as server/pubspec.yaml, since it's already
  # resolved transitively through the minepos_server path dependency; kept
  # here as a direct dependency instead since restore_shop_screen.dart
  # imports it to validate a picked backup file.
  sqlite3: ^2.7.5
  path_provider: ^2.1.6
  path: ^1.9.1
  # Video playback for the customer-display advertising slideshow. The
  # official video_player package doesn't support Windows at all (only
  # Android/iOS/web) — media_kit does, via a bundled libmpv, and its native
  # libs are pulled in as a normal Flutter plugin (media_kit_libs_video), so
  # `flutter build windows` bundles them automatically like
  # sqlite3_flutter_libs already does for the main app.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

# usb_serial 0.5.2 (pulled in transitively by unified_esc_pos_printer for
# Android USB printer support) calls the long-dead jcenter() repository in
# its own android/build.gradle — a hard failure on modern Gradle. No newer
# version of unified_esc_pos_printer drops it, so this points at a vendored
# copy (vendor/usb_serial) with jcenter() replaced by mavenCentral() — same
# Dart API, same version, only the Android Gradle file is patched.
# file_picker 11.0.2's android/build.gradle skips applying the Kotlin plugin
# on AGP >= 9, assuming AGP's built-in Kotlin support will compile its .kt
# files instead — but this project has android.builtInKotlin=false (Flutter
# template default, and needed for app/build.gradle.kts's own explicit
# Kotlin setup), so nothing ever compiled FilePickerPlugin.kt. Vendored copy
# always applies the Kotlin plugin, matching pre-AGP9-aware behavior.
# bonsoir_android 5.1.6 hardcodes compileSdkVersion 33, but its own AndroidX
# dependencies (fragment/window/lifecycle/core, pulled in at versions from
# elsewhere in the graph) require compiling against API 34+. Vendored copy
# uses flutter.compileSdkVersion instead, matching the app's own resolved SDK.
# unified_esc_pos_printer 3.3.3 itself hardcodes compileSdk = 34, but its own
# dependencies (network_info_plus needs 36, libserialport_plus needs 35)
# require more. Vendored copy uses flutter.compileSdkVersion instead.
dependency_overrides:
  usb_serial:
    path: vendor/usb_serial
  file_picker:
    path: vendor/file_picker
  bonsoir_android:
    path: vendor/bonsoir_android
  unified_esc_pos_printer:
    path: vendor/unified_esc_pos_printer

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
