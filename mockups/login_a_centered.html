<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brewpoint - Concept A: Minimal Centered</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..800;1,300..800&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Montserrat', sans-serif; }
  .font-cozy { font-family: 'Quicksand', sans-serif; }
  .card-shadow { box-shadow: 0 20px 45px -10px rgba(40,40,40,0.18); }
  .field { border: 1.5px solid #E4E2C9; }
  .field:focus { border-color: #8D8F46; }
</style>
</head>
<body class="h-full bg-[#F7F4ED] flex items-center justify-center relative overflow-hidden">

  <!-- soft decorative circles -->
  <div class="absolute -top-24 -left-24 w-72 h-72 rounded-full bg-[#C4C569]/25"></div>
  <div class="absolute -bottom-32 -right-20 w-96 h-96 rounded-full bg-[#8D8F46]/15"></div>

  <div class="relative z-10 w-full max-w-sm mx-4">
    <!-- Logo mark -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-[#8D8F46] flex items-center justify-center card-shadow mb-4">
        <svg class="w-8 h-8 text-[#FFFCC7]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 9h13a3 3 0 0 1 0 6h-1M16 9v8a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V9Z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 3c0 1-1 1-1 2M10 3c0 1-1 1-1 2"/>
        </svg>
      </div>
      <h1 class="text-[#282828] text-2xl tracking-[0.3em] uppercase font-semibold">Brewpoint</h1>
      <p class="font-cozy text-[#766D70] text-sm mt-1">Coffee Shop POS</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-3xl p-8 card-shadow border border-[#F0EEDD]">
      <h2 class="font-cozy font-bold text-[#282828] text-lg mb-6">Sign in to continue</h2>
      <form class="flex flex-col gap-4" onsubmit="event.preventDefault(); alert('Simulated sign in');">
        <div>
          <label class="font-cozy text-xs font-bold text-[#766D70] uppercase tracking-wide mb-1 block">Username / Email</label>
          <input type="text" placeholder="brewpoint@gmail.com" class="field w-full rounded-xl px-4 py-3 outline-none text-[#282828] font-cozy focus:ring-2 focus:ring-[#8D8F46]/30 transition" />
        </div>
        <div>
          <label class="font-cozy text-xs font-bold text-[#766D70] uppercase tracking-wide mb-1 block">Password</label>
          <input type="password" placeholder="••••••••" class="field w-full rounded-xl px-4 py-3 outline-none text-[#282828] font-cozy focus:ring-2 focus:ring-[#8D8F46]/30 transition" />
        </div>
        <button type="button" class="font-cozy text-xs text-[#8D8F46] font-bold text-left hover:underline">Forgot password?</button>
        <button type="submit" class="mt-2 bg-[#8D8F46] hover:bg-[#767847] text-[#FFFCC7] font-cozy font-bold py-3.5 rounded-xl transition-colors card-shadow">
          Sign in
        </button>
      </form>
    </div>
    <p class="text-center font-cozy text-xs text-[#766D70] mt-6">v1.0 · Self-hosted or Cloud</p>
  </div>
</body>
</html>
